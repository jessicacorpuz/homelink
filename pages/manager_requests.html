<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeLink - Maintenance Requests</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body data-role="manager">
<div class="app">
<aside class="sidebar"><div><div class="brand"><div class="brand-icon"><i class="fa-solid fa-house"></i></div><span class="brand-name">HomeLink</span></div><nav class="nav"><a href="manager_dashboard.html"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a><a href="manager_properties.html"><i class="fa-solid fa-building"></i> Properties</a><a href="manager_requests.html" class="active"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Requests</a><a href="manager_contractors.html"><i class="fa-solid fa-users"></i> Contractors</a><a href="manager_profile.html"><i class="fa-solid fa-user"></i> Profile</a></nav></div><div class="logout-wrap"><a href="../index.html" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a></div></aside>
<main class="main"><div class="topbar"><div class="bell"><i class="fa-regular fa-bell"></i></div><div class="user"><div class="avatar" id="top-avatar"></div><div class="user-info"><p class="user-name" id="top-name">Loading...</p><p class="user-role">Property Manager</p></div></div></div>
<section class="content"><div class="page-title-row"><div><h1 class="page-title">Maintenance Requests</h1><p class="page-sub">Review tenant requests, assign contractors, and follow repair updates.</p></div></div><div class="tabs" id="requestTabs"><button class="tab active" data-status="All">All</button><button class="tab" data-status="Open">Open</button><button class="tab" data-status="Assigned">Assigned</button><button class="tab" data-status="In Progress">In Progress</button><button class="tab" data-status="Completed">Completed</button></div><div id="requestList" class="card-list"><div class="loading-card"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading requests...</p></div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../static/supabase.js"></script><script src="../static/notifications.js"></script><script>
let requests=[];let contractors=[];let updates=[];
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
async function init(){const {data,error}=await window.supabaseClient.auth.getUser();if(error||!data.user){location.href="../index.html";return}const p=await window.supabaseClient.from("profiles").select("full_name,email,role,avatar_url").eq("id",data.user.id).single();if(p.error||String(p.data?.role||"").toLowerCase()!=="manager"){location.href="../index.html";return}document.getElementById("top-name").textContent=p.data.full_name||p.data.email||data.user.email||"Property Manager";document.getElementById("top-avatar").innerHTML=p.data.avatar_url?`<img src="${esc(p.data.avatar_url)}" alt="">`:(p.data.full_name||p.data.email||"PM").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();await loadContractors();await loadRequests();await window.initHomeLinkNotifications()}
async function loadContractors(){const r=await window.supabaseClient.from("profiles").select("id,full_name,email").eq("role","contractor").order("full_name");if(r.error){alert(r.error.message);return}contractors=r.data||[]}
async function loadRequests(){const list=document.getElementById("requestList");const r=await window.supabaseClient.from("maintenance_requests").select("*").order("created_at",{ascending:false});if(r.error){list.innerHTML=`<div class="empty-card"><h2>Unable to Load Requests</h2><p>${esc(r.error.message)}</p></div>`;return}requests=r.data||[];const ids=requests.map(x=>x.id);if(ids.length){const u=await window.supabaseClient.from("repair_updates").select("id,request_id,contractor_id,update_text,status,created_at").in("request_id",ids).order("created_at",{ascending:false});updates=u.data||[]}else updates=[];renderRequests("All")}
function latest(id){return updates.find(x=>x.request_id===id)}
function badgeClass(status){return {Open:"badge-open",Assigned:"badge-assigned","In Progress":"badge-inprogress",Completed:"badge-completed"}[status]||"badge-open"}
function renderRequests(status){const list=document.getElementById("requestList");const filtered=status==="All"?requests:requests.filter(r=>(r.status||"Open")===status);if(!filtered.length){list.innerHTML='<div class="empty-card"><div class="empty-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div><h2>No Requests</h2><p>There are no maintenance requests in this category.</p></div>';return}list.innerHTML=filtered.map(r=>{const contractor=contractors.find(c=>c.id===r.assigned_contractor_id);const u=latest(r.id);return `<article class="manager-request-card"><div class="request-icon"><i class="fa-solid fa-screwdriver-wrench"></i></div><div class="manager-request-main"><div class="manager-request-top"><div><h3 class="request-title">${esc(r.title)}</h3><p class="request-meta">${esc(r.property_name)} · ${esc(r.unit)} · ${esc(r.issue_type)}</p></div><span class="badge ${badgeClass(r.status)}">${esc(r.status||"Open")}</span></div><p class="manager-request-description">${esc(r.description)}</p><p class="request-meta">Priority: ${esc(r.priority||"Normal")} · ${new Date(r.created_at).toLocaleString()}</p>${contractor?`<p class="request-meta">Assigned to: ${esc(contractor.full_name||contractor.email||"Contractor")}</p>`:""}${u?`<div class="job-update"><p class="request-meta">Latest contractor update · ${new Date(u.created_at).toLocaleString()}</p><p style="margin-top:6px;color:#334155;">${esc(u.update_text)}</p></div>`:""}</div><div class="manager-request-actions"><label>Contractor<select onchange="assignContractor('${r.id}',this.value)"><option value="">Unassigned</option>${contractors.map(c=>`<option value="${c.id}" ${c.id===r.assigned_contractor_id?"selected":""}>${esc(c.full_name||c.email||"Contractor")}</option>`).join("")}</select></label><label>Status<select onchange="updateStatus('${r.id}',this.value)"><option ${r.status==="Open"?"selected":""}>Open</option><option ${r.status==="Assigned"?"selected":""}>Assigned</option><option ${r.status==="In Progress"?"selected":""}>In Progress</option><option ${r.status==="Completed"?"selected":""}>Completed</option></select></label></div></article>`}).join("")}
async function assignContractor(id,contractorId){const r=await window.supabaseClient.from("maintenance_requests").update({assigned_contractor_id:contractorId||null,status:contractorId?"Assigned":"Open"}).eq("id",id);if(r.error){alert(r.error.message);return}await loadRequests()}
async function updateStatus(id,status){const r=await window.supabaseClient.from("maintenance_requests").update({status}).eq("id",id);if(r.error){alert(r.error.message);return}await loadRequests()}
document.querySelectorAll("#requestTabs .tab").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("#requestTabs .tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");renderRequests(btn.dataset.status)});document.getElementById("logoutBtn").onclick=async e=>{e.preventDefault();await window.supabaseClient.auth.signOut();location.href="../index.html"};init();
</script>
</body>
</html>
