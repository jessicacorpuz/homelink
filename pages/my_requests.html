<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HomeLink - My Maintenance Requests</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-house"></i></div>
        <span class="brand-name">HomeLink</span>
      </div>
      <nav class="nav">
        <a href="tenant_dashboard.html"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
        <a href="#"><i class="fa-solid fa-building"></i> My Properties</a>
        <a href="my_requests.html" class="active"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Requests</a>
        <a href="#"><i class="fa-solid fa-user"></i> Profile</a>
      </nav>
    </div>
    <div class="logout-wrap">
      <a href="../index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="bell"><i class="fa-regular fa-bell"></i><span class="dot"></span></div>
      <div class="user">
        <div class="avatar"></div>
        <div class="user-info">
          <p class="user-name"></p>
          <p class="user-role">Tenant</p>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>

    <div class="content">
      <div class="page-head">
        <div>
          <h1 class="page-title">My Maintenance Requests</h1>
          <p class="page-sub">Track the status of your requests.</p>
        </div>
        <a href="report_request.html" class="btn-primary" style="display:inline-flex;align-items:center;gap:8px;">
          <i class="fa-solid fa-plus"></i> New Request
        </a>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="filterStatus(this, 'All')">All</button>
        <button class="tab" onclick="filterStatus(this, 'Open')">Open</button>
        <button class="tab" onclick="filterStatus(this, 'In Progress')">In Progress</button>
        <button class="tab" onclick="filterStatus(this, 'Completed')">Completed</button>
      </div>

      <div class="card-list">
        <p class="empty-state">No maintenance requests yet.</p>
      </div>
    </div>
  </div>
</div>

<script src="../static/js/app.js"></script>
</body>
</html>
