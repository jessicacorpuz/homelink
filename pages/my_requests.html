<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HomeLink - My Maintenance Requests</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body data-role="tenant">
<div class="app">
<aside class="sidebar"><div><div class="brand"><div class="brand-icon"><i class="fa-solid fa-house"></i></div><span class="brand-name">HomeLink</span></div><nav class="nav"><a href="tenant_dashboard.html"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a><a href="my_properties.html"><i class="fa-solid fa-building"></i> My Properties</a><a href="my_requests.html" class="active"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Requests</a><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></nav></div><div class="logout-wrap"><a href="../index.html" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a></div></aside>
<main class="main"><div class="topbar"><div class="bell"><i class="fa-regular fa-bell"></i></div><div class="user"><div class="avatar" id="top-avatar"></div><div class="user-info"><p class="user-name" id="top-name">Loading...</p><p class="user-role">Tenant</p></div></div></div>
<section class="content"><div class="page-head"><div><h1 class="page-title">My Maintenance Requests</h1><p class="page-sub">Track the status and contractor updates for your requests.</p></div><a href="report_request.html" class="btn-primary"><i class="fa-solid fa-plus"></i> New Request</a></div><div class="tabs" id="requestTabs"><button class="tab active" data-status="All">All</button><button class="tab" data-status="Open">Open</button><button class="tab" data-status="In Progress">In Progress</button><button class="tab" data-status="Completed">Completed</button></div><div id="request-list" class="card-list"><p class="empty-state">Loading requests...</p></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../static/supabase.js"></script><script src="../static/notifications.js"></script><script>
let allRequests=[];let allUpdates=[];let currentUser=null;
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
async function init(){const {data,error}=await window.supabaseClient.auth.getUser();if(error||!data.user){location.href="../index.html";return}currentUser=data.user;const p=await window.supabaseClient.from("profiles").select("full_name,email,role,avatar_url").eq("id",currentUser.id).single();if(p.error||String(p.data?.role||"").toLowerCase()!=="tenant"){location.href="../index.html";return}const name=p.data.full_name||p.data.email||currentUser.email||"Tenant";document.getElementById("top-name").textContent=name;document.getElementById("top-avatar").innerHTML=p.data.avatar_url?`<img src="${esc(p.data.avatar_url)}" alt="">`:name.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();await loadRequests();await window.initHomeLinkNotifications()}
async function loadRequests(){const r=await window.supabaseClient.from("maintenance_requests").select("*").eq("tenant_id",currentUser.id).order("created_at",{ascending:false});if(r.error){document.getElementById("request-list").innerHTML=`<p class="empty-state">${esc(r.error.message)}</p>`;return}allRequests=r.data||[];const ids=allRequests.map(x=>x.id);if(ids.length){const u=await window.supabaseClient.from("repair_updates").select("id,request_id,update_text,status,created_at").in("request_id",ids).order("created_at",{ascending:false});allUpdates=u.data||[]}else allUpdates=[];renderRequests(allRequests)}
function latest(id){return allUpdates.find(x=>x.request_id===id)}
function renderRequests(rows){const container=document.getElementById("request-list");if(!rows.length){container.innerHTML='<p class="empty-state">No maintenance requests yet.</p>';return}container.innerHTML=rows.map(r=>{const u=latest(r.id);const status=r.status||"Open";return `<div class="request-card" data-status="${esc(status)}"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start;"><div><h3 style="margin:0 0 7px;color:#1e293b;">${esc(r.title)}</h3><p style="margin:0;color:#64748b;font-size:14px;">${esc(r.property_name)} · ${esc(r.unit)}</p></div><span class="badge ${status==="Completed"?"badge-completed":status==="In Progress"?"badge-inprogress":status==="Assigned"?"badge-assigned":"badge-open"}">${esc(status)}</span></div><div style="margin-top:15px;color:#475569;font-size:14px;">${esc(r.description)}</div><div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid #e2e8f0;color:#64748b;font-size:13px;"><span><i class="fa-solid fa-wrench"></i> ${esc(r.issue_type)}</span><span><i class="fa-solid fa-flag"></i> ${esc(r.priority||"Normal")}</span><span><i class="fa-regular fa-calendar"></i> ${new Date(r.created_at).toLocaleDateString()}</span></div>${u?`<div class="job-update"><p class="request-meta">Latest contractor update · ${new Date(u.created_at).toLocaleString()}</p><p style="margin-top:6px;color:#334155;">${esc(u.update_text)}</p></div>`:""}${status==="Completed"?'<div class="job-update"><p style="font-weight:600;color:#166534;">This request has been completed.</p></div>':""}</div>`}).join("")}
document.querySelectorAll("#requestTabs .tab").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("#requestTabs .tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");const s=btn.dataset.status;renderRequests(s==="All"?allRequests:allRequests.filter(r=>(r.status||"Open")===s))});document.getElementById("logoutBtn").onclick=async e=>{e.preventDefault();await window.supabaseClient.auth.signOut();location.href="../index.html"};init();
</script>
</body>
</html>
