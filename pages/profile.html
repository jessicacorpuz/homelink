<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HomeLink - Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div>

                <div class="brand">
                    <div class="brand-icon">
                        <i class="fa-solid fa-house"></i>
                    </div>

                    <span class="brand-name">
                        HomeLink
                    </span>
                </div>

                <nav class="nav">

                    <a href="tenant_dashboard.html">
                        <i class="fa-solid fa-table-cells-large"></i>
                        Dashboard
                    </a>

                    <a href="my_properties.html">
                        <i class="fa-solid fa-building"></i>
                        My Properties
                    </a>

                    <a href="my_requests.html">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                        Maintenance Requests
                    </a>

                    <a href="profile.html" class="active">
                        <i class="fa-solid fa-user"></i>
                        Profile
                    </a>

                </nav>

            </div>

            <div class="logout-wrap">

                <a href="../index.html" onclick="logout(event)">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Log Out
                </a>

            </div>

        </aside>


        <div class="main">

            <div class="topbar">

                <div class="bell">
                    <i class="fa-regular fa-bell"></i>
                </div>

                <div class="user">

                    <div class="avatar" id="top-avatar">
                        <span>U</span>
                    </div>

                    <div class="user-info">

                        <p class="user-name" id="top-name">
                            Loading...
                        </p>

                        <p class="user-role" id="top-role">
                            User
                        </p>

                    </div>

                </div>

            </div>


            <div class="content">

                <h1 class="page-title">
                    My Profile
                </h1>

                <p class="page-sub">
                    Keep your HomeLink account information up to date.
                </p>


                <div class="profile-panel">

                    <div class="profile-header">

                        <div
                            class="profile-avatar"
                            id="profile-avatar"
                        >
                            <span>U</span>
                        </div>

                        <div class="profile-photo-section">

                            <label
                                class="btn-secondary"
                                for="avatar-input"
                            >
                                Change photo
                            </label>

                            <input
                                id="avatar-input"
                                type="file"
                                accept="image/png,image/jpeg,image/jpg"
                                hidden
                            >

                            <p class="hint">
                                JPG or PNG, up to 5MB.
                            </p>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="full-name">
                            Full name
                        </label>

                        <input
                            id="full-name"
                            type="text"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            id="email"
                            type="email"
                            disabled
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone number
                        </label>

                        <input
                            id="phone"
                            type="tel"
                            placeholder="09XX XXX XXXX"
                        >

                    </div>


                    <div class="form-group">

                        <label for="role">
                            Role
                        </label>

                        <input
                            id="role"
                            type="text"
                            disabled
                        >

                    </div>


                    <button
                        class="btn-primary"
                        id="save"
                        onclick="saveProfile()"
                    >
                        Save changes
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../static/supabase.js"></script>

    <script>

        let userId = "";
        let avatarUrl = "";


        function initials(name) {

            const value = (name || "User")
                .trim();

            if (!value) {
                return "U";
            }

            return value
                .split(/\s+/)
                .slice(0, 2)
                .map(word => word.charAt(0))
                .join("")
                .toUpperCase();

        }


        function setAvatar() {

            const profileAvatar =
                document.getElementById("profile-avatar");

            const topAvatar =
                document.getElementById("top-avatar");

            const name =
                document.getElementById("full-name").value;

            const letters =
                initials(name);


            if (avatarUrl) {

                profileAvatar.innerHTML = `
                    <img
                        src="${avatarUrl}"
                        alt="Profile photo"
                    >
                `;

                topAvatar.innerHTML = `
                    <img
                        src="${avatarUrl}"
                        alt="Profile photo"
                    >
                `;

            } else {

                profileAvatar.innerHTML = `
                    <span>${letters}</span>
                `;

                topAvatar.innerHTML = `
                    <span>${letters}</span>
                `;

            }

        }


        async function loadProfile() {

            try {

                const {
                    data: authData,
                    error: authError
                } = await window.supabaseClient.auth.getUser();


                if (authError) {

                    console.error(
                        "Auth error:",
                        authError
                    );

                    window.location.href =
                        "../index.html";

                    return;

                }


                if (!authData.user) {

                    window.location.href =
                        "../index.html";

                    return;

                }


                const user =
                    authData.user;

                userId =
                    user.id;


                const authName =
                    user.user_metadata?.full_name ||
                    user.user_metadata?.name ||
                    "";


                const authEmail =
                    user.email ||
                    "";


                const {
                    data: profile,
                    error: profileError
                } = await window.supabaseClient
                    .from("profiles")
                    .select(
                        "full_name,email,phone,avatar_url,role"
                    )
                    .eq("id", userId)
                    .maybeSingle();


                if (profileError) {

                    console.error(
                        "Profile error:",
                        profileError
                    );

                    document.getElementById(
                        "full-name"
                    ).value = authName;

                    document.getElementById(
                        "email"
                    ).value = authEmail;

                    document.getElementById(
                        "role"
                    ).value =
                        user.user_metadata?.role ||
                        "Tenant";

                    document.getElementById(
                        "top-name"
                    ).textContent =
                        authName ||
                        authEmail ||
                        "Tenant";

                    document.getElementById(
                        "top-role"
                    ).textContent =
                        user.user_metadata?.role ||
                        "Tenant";

                    setAvatar();

                    alert(
                        "Your profile could not be loaded from the profiles table. Check the Supabase profiles policies."
                    );

                    return;

                }


                const fullName =
                    profile?.full_name ||
                    authName ||
                    authEmail ||
                    "Tenant";


                const email =
                    profile?.email ||
                    authEmail;


                const phone =
                    profile?.phone ||
                    "";


                const role =
                    profile?.role ||
                    user.user_metadata?.role ||
                    "Tenant";


                avatarUrl =
                    profile?.avatar_url ||
                    "";


                document.getElementById(
                    "full-name"
                ).value = fullName;


                document.getElementById(
                    "email"
                ).value = email;


                document.getElementById(
                    "phone"
                ).value = phone;


                document.getElementById(
                    "role"
                ).value = role;


                document.getElementById(
                    "top-name"
                ).textContent = fullName;


                document.getElementById(
                    "top-role"
                ).textContent = role;


                setAvatar();

            } catch (error) {

                console.error(
                    "Unexpected error:",
                    error
                );

                alert(
                    "Something went wrong while loading your profile."
                );

            }

        }


        document
            .getElementById("avatar-input")
            .addEventListener(
                "change",
                async function(event) {

                    const file =
                        event.target.files[0];


                    if (!file) {
                        return;
                    }


                    if (
                        file.type !== "image/jpeg" &&
                        file.type !== "image/png"
                    ) {

                        alert(
                            "Please choose a JPG or PNG image."
                        );

                        event.target.value = "";

                        return;

                    }


                    if (
                        file.size >
                        5 * 1024 * 1024
                    ) {

                        alert(
                            "Image must be 5MB or smaller."
                        );

                        event.target.value = "";

                        return;

                    }


                    const extension =
                        file.type === "image/png"
                            ? "png"
                            : "jpg";


                    const path =
                        userId +
                        "/profile." +
                        extension;


                    const upload =
                        await window.supabaseClient
                            .storage
                            .from("avatars")
                            .upload(
                                path,
                                file,
                                {
                                    upsert: true,
                                    contentType: file.type
                                }
                            );


                    if (upload.error) {

                        console.error(
                            "Upload error:",
                            upload.error
                        );

                        alert(
                            "Could not upload the profile picture: " +
                            upload.error.message
                        );

                        return;

                    }


                    const publicUrl =
                        window.supabaseClient
                            .storage
                            .from("avatars")
                            .getPublicUrl(path)
                            .data
                            .publicUrl;


                    avatarUrl =
                        publicUrl +
                        "?t=" +
                        Date.now();


                    const {
                        error: updateError
                    } = await window.supabaseClient
                        .from("profiles")
                        .update({
                            avatar_url:
                                avatarUrl
                        })
                        .eq(
                            "id",
                            userId
                        );


                    if (updateError) {

                        console.error(
                            "Avatar profile update error:",
                            updateError
                        );

                        alert(
                            "The picture was uploaded, but the profile could not be updated: " +
                            updateError.message
                        );

                        return;

                    }


                    setAvatar();

                    alert(
                        "Profile picture updated successfully!"
                    );

                }
            );


        async function saveProfile() {

            const button =
                document.getElementById("save");


            const fullName =
                document
                    .getElementById("full-name")
                    .value
                    .trim();


            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            if (!fullName) {

                alert(
                    "Please enter your full name."
                );

                return;

            }


            button.disabled = true;

            button.textContent =
                "Saving...";


            const {
                error
            } = await window.supabaseClient
                .from("profiles")
                .update({
                    full_name:
                        fullName,

                    phone:
                        phone,

                    avatar_url:
                        avatarUrl,

                    updated_at:
                        new Date().toISOString()
                })
                .eq(
                    "id",
                    userId
                );


            button.disabled = false;

            button.textContent =
                "Save changes";


            if (error) {

                console.error(
                    "Save profile error:",
                    error
                );

                alert(
                    "Could not save your profile: " +
                    error.message
                );

                return;

            }


            document.getElementById(
                "top-name"
            ).textContent = fullName;


            setAvatar();


            alert(
                "Profile updated successfully!"
            );

        }


        async function logout(event) {

            event.preventDefault();

            await window.supabaseClient
                .auth
                .signOut();

            window.location.href =
                "../index.html";

        }


        loadProfile();

    </script>

</body>
</html>
