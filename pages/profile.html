<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HomeLink - Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div>

                <div class="brand">
                    <div class="brand-icon">
                        <i class="fa-solid fa-house"></i>
                    </div>

                    <span class="brand-name">
                        HomeLink
                    </span>
                </div>

                <nav class="nav">

                    <a href="tenant_dashboard.html">
                        <i class="fa-solid fa-table-cells-large"></i>
                        Dashboard
                    </a>

                    <a href="my_properties.html">
                        <i class="fa-solid fa-building"></i>
                        My Properties
                    </a>

                    <a href="my_requests.html">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                        Maintenance Requests
                    </a>

                    <a href="profile.html" class="active">
                        <i class="fa-solid fa-user"></i>
                        Profile
                    </a>

                </nav>

            </div>

            <div class="logout-wrap">

                <a href="../index.html" onclick="logout(event)">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    Log Out
                </a>

            </div>

        </aside>


        <div class="main">

            <div class="topbar">

                <div class="bell">
                    <i class="fa-regular fa-bell"></i>
                </div>

                <div class="user">

                    <div class="avatar" id="top-avatar"></div>

                    <div class="user-info">

                        <p class="user-name" id="top-name">
                            Loading...
                        </p>

                        <p class="user-role" id="top-role">
                            User
                        </p>

                    </div>

                </div>

            </div>


            <div class="content">

                <h1 class="page-title">
                    My Profile
                </h1>

                <p class="page-sub">
                    Keep your HomeLink account information up to date.
                </p>


                <div class="profile-panel">

                    <div class="profile-header">

                        <div
                            class="profile-avatar"
                            id="profile-avatar"
                        ></div>

                        <div class="profile-photo-section">

                            <label
                                class="btn-secondary"
                                for="avatar-input"
                            >
                                Change photo
                            </label>

                            <input
                                id="avatar-input"
                                type="file"
                                accept="image/*"
                                hidden
                            >

                            <p class="hint">
                                JPG or PNG, up to 5MB.
                            </p>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="full-name">
                            Full name
                        </label>

                        <input
                            id="full-name"
                            type="text"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            id="email"
                            type="email"
                            disabled
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone number
                        </label>

                        <input
                            id="phone"
                            type="tel"
                            placeholder="09XX XXX XXXX"
                        >

                    </div>


                    <div class="form-group">

                        <label for="role">
                            Role
                        </label>

                        <input
                            id="role"
                            type="text"
                            disabled
                        >

                    </div>


                    <button
                        class="btn-primary"
                        id="save"
                        onclick="saveProfile()"
                    >
                        Save changes
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../static/supabase.js"></script>

    <script>

        let userId;
        let avatarUrl = "";


        function initials(name) {

            return (name || "U")
                .split(/\s+/)
                .filter(Boolean)
                .slice(0, 2)
                .map(x => x[0])
                .join("")
                .toUpperCase();

        }


        async function loadProfile() {

            const {
                data,
                error
            } = await window.supabaseClient.auth.getUser();


            if (error || !data.user) {

                location.href = "../index.html";
                return;

            }


            userId = data.user.id;


            const {
                data: profile,
                error: profileError
            } = await window.supabaseClient
                .from("profiles")
                .select(
                    "full_name,email,phone,avatar_url,role"
                )
                .eq("id", userId)
                .single();


            if (profileError) {

                alert(profileError.message);
                return;

            }


            document.getElementById("full-name").value =
                profile.full_name || "";


            document.getElementById("email").value =
                profile.email || data.user.email || "";


            document.getElementById("phone").value =
                profile.phone || "";


            document.getElementById("role").value =
                profile.role || "";


            document.getElementById("top-name").textContent =
                profile.full_name ||
                data.user.email ||
                "User";


            document.getElementById("top-role").textContent =
                profile.role ||
                "User";


            avatarUrl = profile.avatar_url || "";

            setAvatar();

        }


        function setAvatar() {

            const avatars = [
                document.getElementById("profile-avatar"),
                document.getElementById("top-avatar")
            ];


            avatars.forEach(el => {

                if (!el) {
                    return;
                }


                if (avatarUrl) {

                    el.innerHTML = `
                        <img
                            src="${avatarUrl}"
                            alt="Profile photo"
                        >
                    `;

                } else {

                    el.textContent = initials(
                        document.getElementById("full-name").value
                    );

                }

            });

        }


        document
            .getElementById("avatar-input")
            .addEventListener(
                "change",
                async event => {

                    const file =
                        event.target.files[0];


                    if (!file) {
                        return;
                    }


                    if (file.size > 5 * 1024 * 1024) {

                        alert(
                            "Image must be 5MB or smaller."
                        );

                        return;

                    }


                    const path =
                        userId +
                        "/avatar-" +
                        Date.now() +
                        "-" +
                        file.name.replace(
                            /[^a-zA-Z0-9._-]/g,
                            "_"
                        );


                    const upload =
                        await window.supabaseClient
                            .storage
                            .from("avatars")
                            .upload(
                                path,
                                file,
                                {
                                    upsert: true,
                                    contentType: file.type
                                }
                            );


                    if (upload.error) {

                        alert(upload.error.message);
                        return;

                    }


                    avatarUrl =
                        window.supabaseClient
                            .storage
                            .from("avatars")
                            .getPublicUrl(path)
                            .data
                            .publicUrl;


                    setAvatar();

                }
            );


        async function saveProfile() {

            const button =
                document.getElementById("save");


            button.disabled = true;


            const {
                error
            } = await window.supabaseClient
                .from("profiles")
                .update({
                    full_name:
                        document
                            .getElementById("full-name")
                            .value
                            .trim(),

                    phone:
                        document
                            .getElementById("phone")
                            .value
                            .trim(),

                    avatar_url:
                        avatarUrl,

                    updated_at:
                        new Date().toISOString()
                })
                .eq("id", userId);


            button.disabled = false;


            if (error) {

                alert(error.message);
                return;

            }


            document.getElementById("top-name").textContent =
                document
                    .getElementById("full-name")
                    .value ||
                document
                    .getElementById("email")
                    .value;


            setAvatar();

            alert("Profile updated successfully!");

        }


        async function logout(event) {

            event.preventDefault();

            await window.supabaseClient.auth.signOut();

            location.href = "../index.html";

        }


        loadProfile();

    </script>

</body>
</html>
