<!DOCTYPE html><html lang="en"><head>
<link rel="icon" type="image/svg+xml" href="../static/favicon.svg">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HomeLink - Properties</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="../static/css/styles.css"></head>
<body data-role="contractor"><div class="app"><aside class="sidebar"><div><div class="brand"><div class="brand-icon"><i class="fa-solid fa-house"></i></div><span class="brand-name">HomeLink</span></div><nav class="nav"><a href="contractor_view.html"><i class="fa-solid fa-screwdriver-wrench"></i> Assigned Jobs</a><a class="active" href="contractor_properties.html"><i class="fa-solid fa-building"></i> Properties</a><a href="manager_contacts.html"><i class="fa-solid fa-address-book"></i> Contacts</a><a href="contractor_profile.html"><i class="fa-solid fa-user"></i> Profile</a></nav></div><div class="logout-wrap"><a href="../index.html" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a></div></aside>
<main class="main"><div class="topbar"><div class="bell"><i class="fa-regular fa-bell"></i></div><a class="user profile-link" href="contractor_profile.html"><div class="avatar" id="top-avatar"></div><div class="user-info"><p class="user-name" id="top-name">Loading...</p><p class="user-role">Contractor</p></div><i class="fa-solid fa-chevron-down"></i></a></div><section class="content"><div class="page-head"><div><h1 class="page-title">Properties</h1><p class="page-sub">View property details and tenant contact information. These details are read-only.</p></div></div><div id="propertyList" class="property-grid"><div class="loading-card">Loading properties...</div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../static/supabase.js"></script><script src="../static/js/notifications.js"></script><script>
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
async function init(){const {data,error}=await window.supabaseClient.auth.getUser();if(error||!data.user){location.href="../index.html";return}const user=data.user;const me=await window.supabaseClient.from("profiles").select("full_name,email,role,avatar_url").eq("id",user.id).single();if(me.error||String(me.data?.role||"").toLowerCase()!=="contractor"){location.href="../index.html";return}const name=me.data.full_name||me.data.email||user.email||"Contractor";document.getElementById("top-name").textContent=name;document.getElementById("top-avatar").innerHTML=me.data.avatar_url?`<img src="${esc(me.data.avatar_url)}" alt="">`:esc(name.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase());const list=document.getElementById("propertyList");const r=await window.supabaseClient.from("maintenance_requests").select("*").eq("assigned_contractor_id",user.id).order("created_at",{ascending:false});if(r.error){list.innerHTML=`<div class="empty-card"><h2>Unable to load assigned requests</h2><p>${esc(r.error.message)}</p></div>`;return}const requests=r.data||[];if(!requests.length){list.innerHTML='<div class="empty-card"><h2>No assigned properties yet</h2><p>Properties will appear here when a manager assigns a maintenance request to you.</p></div>';if(window.initHomeLinkNotifications)await window.initHomeLinkNotifications();return}const keys=new Set(requests.map(j=>`${j.property_name||""}||${j.unit||""}`));const propertyRows=[...keys].map(k=>{const [propertyName,unit]=k.split("||");return {property_name:propertyName,unit,requests:requests.filter(j=>(j.property_name||"")===propertyName&&(j.unit||"")===unit)}});list.innerHTML=propertyRows.map((p,i)=>`<article class="property-card"><div class="property-header"><div class="property-icon"><i class="fa-solid fa-building"></i></div><span class="badge badge-assigned">${p.requests.length} assigned ${p.requests.length===1?"request":"requests"}</span></div><div class="property-body"><h2>${esc(p.property_name||"Property")}</h2><div class="property-details"><div class="detail-row"><i class="fa-solid fa-door-open"></i><div><span>Unit</span><strong>${esc(p.unit||"Not specified")}</strong></div></div></div><h3 style="margin:18px 0 10px">Requests assigned to you</h3><div class="assigned-property-requests">${p.requests.map(j=>`<article class="job-update" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong>${esc(j.title||"Maintenance request")}</strong><span class="badge ${j.status==="Completed"?"badge-completed":j.status==="In Progress"?"badge-inprogress":"badge-assigned"}">${esc(j.status||"Assigned")}</span></div><p class="request-meta">${esc(j.issue_type||"Issue")}${j.created_at?" · "+new Date(j.created_at).toLocaleDateString():""}</p><p style="margin-top:8px">${esc(j.description||"No description provided.")}</p><p style="margin-top:10px"><a class="btn-secondary" href="contractor_view.html?request=${encodeURIComponent(j.id)}">Open request</a></p></article>`).join("")}</div></div></article>`).join("");if(window.initHomeLinkNotifications)await window.initHomeLinkNotifications()}
document.getElementById("logoutBtn").onclick=async e=>{e.preventDefault();await window.supabaseClient.auth.signOut();location.href="../index.html"};init();
</script></body></html>
