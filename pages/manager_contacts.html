<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   HomeLink - Contacts
  </title>
  <link href="../static/favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="../static/css/styles.css" rel="stylesheet"/>
 </head>
 <body data-role="manager">
  <div class="app">
   <aside class="sidebar">
    <div>
     <div class="brand">
      <div class="brand-icon">
       <i class="fa-solid fa-house">
       </i>
      </div>
      <span class="brand-name">
       HomeLink
      </span>
     </div>
     <nav aria-label="Main navigation" class="nav" id="mainNav">
     </nav>
    </div>
    <div class="logout-wrap">
     <a href="../index.html" id="logoutBtn">
      <i class="fa-solid fa-arrow-right-from-bracket">
      </i>
      <span>
       Log Out
      </span>
     </a>
    </div>
   </aside>
   <main class="main">
    <header class="topbar">
     <div class="bell">
      <i class="fa-regular fa-bell">
      </i>
     </div>
     <a class="user profile-link" href="manager_profile.html">
      <div class="avatar" id="top-avatar">
      </div>
      <div class="user-info">
       <p class="user-name" id="top-name">
        Loading...
       </p>
       <p class="user-role" id="top-role">
        Manager
       </p>
      </div>
      <i class="fa-solid fa-chevron-down">
      </i>
     </a>
    </header>
    <section class="content">
     <div class="page-head">
      <div>
       <h1 class="page-title">
        People &amp; Contacts
       </h1>
       <p class="page-sub">
        Find contact details for tenants, managers, and contractors.
       </p>
      </div>
     </div>
     <div aria-label="Filter contacts" class="tabs" id="contactTabs" role="tablist">
      <button class="tab active" data-kind="all">
       Everyone
      </button>
      <button class="tab" data-kind="tenant">
       Tenants
      </button>
      <button class="tab" data-kind="manager">
       Managers
      </button>
      <button class="tab" data-kind="contractor">
       Contractors
      </button>
     </div>
     <div aria-live="polite" class="card-list" id="contactList">
      <div class="loading-card">
       Loading contacts...
      </div>
     </div>
    </section>
   </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <script src="../static/supabase.js">
  </script>
  <script src="../static/js/notifications.js">
  </script>
  <script src="../static/js/contacts.js">
  </script>
  <script src="../static/js/popups.js">
  </script>
 </body>
</html>
