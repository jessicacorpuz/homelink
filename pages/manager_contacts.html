<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" type="image/svg+xml" href="../static/favicon.svg">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HomeLink - Contacts</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="../static/css/styles.css"></head>
<body data-role="manager"><div class="app"><aside class="sidebar"><div><div class="brand"><div class="brand-icon"><i class="fa-solid fa-house"></i></div><span class="brand-name">HomeLink</span></div><nav class="nav" id="mainNav"></nav></div><div class="logout-wrap"><a href="../index.html" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a></div></aside>
<main class="main"><div class="topbar"><div class="bell"><i class="fa-regular fa-bell"></i></div><a class="user profile-link" href="manager_profile.html"><div class="avatar" id="top-avatar"></div><div class="user-info"><p class="user-name" id="top-name">Loading...</p><p class="user-role" id="top-role">Contacts</p></div><i class="fa-solid fa-chevron-down"></i></a></div><section class="content"><div class="page-head"><div><h1 class="page-title">People & Contacts</h1><p class="page-sub">Find contact details for managers and contractors.</p></div></div><div class="tabs" id="contactTabs"><button class="tab active" data-kind="all">Everyone</button><button class="tab" data-kind="manager">Managers</button><button class="tab" data-kind="contractor">Contractors</button></div><div id="contactList" class="card-list"><div class="loading-card">Loading contacts...</div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../static/supabase.js"></script><script src="../static/js/notifications.js"></script><script>
let people=[];
const esc=v=>String(v??"").replace(/[&<>'"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[c]));
async function init(){const {data,error}=await window.supabaseClient.auth.getUser();if(error||!data.user){location.href="../index.html";return}const p=await window.supabaseClient.from("profiles").select("id,full_name,email,role,phone,avatar_url").eq("id",data.user.id).single();if(p.error){location.href="../index.html";return}const role=String(p.data.role||"").toLowerCase();document.body.dataset.role=role;const profile=role==="manager"?"manager_profile.html":role==="contractor"?"contractor_profile.html":"profile.html";document.querySelector(".profile-link").href=profile;document.getElementById("top-name").textContent=p.data.full_name||p.data.email||data.user.email;document.getElementById("top-role").textContent=role[0].toUpperCase()+role.slice(1);document.getElementById("top-avatar").innerHTML=p.data.avatar_url?`<img src="${esc(p.data.avatar_url)}" alt="">`:esc((p.data.full_name||p.data.email||"U").split(/\\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase());document.getElementById("mainNav").innerHTML=role==="manager"?'<a href="manager_dashboard.html">Dashboard</a><a href="manager_properties.html">Properties</a><a href="manager_requests.html">Maintenance Requests</a><a href="manager_contractors.html">Contractors</a><a class="active" href="manager_contacts.html">Contacts</a><a href="manager_profile.html">Profile</a>':role==="contractor"?'<a href="contractor_view.html">Assigned Jobs</a><a href="contractor_properties.html">Properties</a><a class="active" href="manager_contacts.html">Contacts</a><a href="contractor_profile.html">Profile</a>':'<a href="tenant_dashboard.html">Dashboard</a><a href="my_properties.html">My Properties</a><a href="my_requests.html">My Requests</a><a class="active" href="manager_contacts.html">Contacts</a><a href="profile.html">Profile</a>';const r=await window.supabaseClient.from("profiles").select("id,full_name,email,role,phone").in("role",["manager","contractor"]).order("full_name");if(r.error){document.getElementById("contactList").textContent=r.error.message;return}people=r.data||[];render("all");await window.initHomeLinkNotifications()}
function render(kind){const rows=kind==="all"?people:people.filter(p=>p.role===kind);const list=document.getElementById("contactList");if(!rows.length){list.innerHTML='<div class="empty-card"><h2>No contacts found</h2></div>';return}list.innerHTML=rows.map(p=>`<article class="contact-card"><div class="contact-avatar"><i class="fa-solid fa-${p.role==="manager"?"user-tie":"screwdriver-wrench"}"></i></div><div class="contact-body"><h3>${esc(p.full_name||p.email||p.role)}</h3><span class="badge ${p.role==="manager"?"badge-assigned":"badge-inprogress"}">${esc(p.role)}</span><p><i class="fa-regular fa-envelope"></i> <a href="mailto:${esc(p.email||"")}">${esc(p.email||"Email not provided")}</a></p><p><i class="fa-solid fa-phone"></i> ${p.phone?`<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>`:"Contact number not provided"}</p></div></article>`).join("")}
document.querySelectorAll("#contactTabs .tab").forEach(b=>b.onclick=()=>{document.querySelectorAll("#contactTabs .tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.kind)});document.getElementById("logoutBtn").onclick=async e=>{e.preventDefault();await window.supabaseClient.auth.signOut();location.href="../index.html"};init();
</script></body></html>
