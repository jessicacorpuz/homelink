<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeLink - Manager Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body data-role="manager">
<div class="app">
<aside class="sidebar"><div><div class="brand"><div class="brand-icon"><i class="fa-solid fa-house"></i></div><span class="brand-name">HomeLink</span></div><nav class="nav"><a href="manager_dashboard.html"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a><a href="manager_properties.html"><i class="fa-solid fa-building"></i> Properties</a><a href="manager_requests.html"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Requests</a><a href="manager_contractors.html"><i class="fa-solid fa-users"></i> Contractors</a><a href="manager_profile.html" class="active"><i class="fa-solid fa-user"></i> Profile</a></nav></div><div class="logout-wrap"><a href="../index.html" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a></div></aside>
<main class="main"><div class="topbar"><div class="bell"><i class="fa-regular fa-bell"></i></div><div class="user"><div class="avatar" id="top-avatar"></div><div class="user-info"><p class="user-name" id="top-name">Loading...</p><p class="user-role">Property Manager</p></div></div></div>
<section class="content"><h1 class="page-title">Manager Profile</h1><p class="page-sub">Keep your manager account information up to date.</p><div class="profile-panel role-profile"><div class="profile-header"><div class="profile-avatar" id="profile-avatar"><span>PM</span></div><div class="profile-photo-section"><label class="btn-secondary" for="avatar-input">Change photo</label><input id="avatar-input" type="file" accept="image/png,image/jpeg,image/jpg" hidden><p class="hint">JPG or PNG, up to 5MB.</p></div></div><div class="form-group"><label for="full-name">Full name</label><input id="full-name" type="text"></div><div class="form-group"><label for="email">Email address</label><input id="email" type="email" disabled></div><div class="form-group"><label for="phone">Phone number</label><input id="phone" type="tel" placeholder="09XX XXX XXXX"></div><div class="form-group"><label for="role">Role</label><input id="role" type="text" value="Property Manager" disabled></div><button class="btn-primary" id="saveBtn">Save changes</button></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../static/supabase.js"></script><script src="../static/notifications.js"></script><script>
let userId="";let avatarUrl="";
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
const initials=name=>(name||"PM").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"PM";
function renderAvatar(){const name=document.getElementById("full-name").value||"Property Manager";const markup=avatarUrl?`<img src="${esc(avatarUrl)}" alt="Profile photo">`:`<span>${esc(initials(name))}</span>`;document.getElementById("profile-avatar").innerHTML=markup;document.getElementById("top-avatar").innerHTML=markup}
async function init(){const {data,error}=await window.supabaseClient.auth.getUser();if(error||!data.user){location.href="../index.html";return}userId=data.user.id;const p=await window.supabaseClient.from("profiles").select("full_name,email,role,phone,avatar_url").eq("id",userId).single();if(p.error||String(p.data?.role||"").toLowerCase()!=="manager"){location.href="../index.html";return}document.getElementById("full-name").value=p.data.full_name||"";document.getElementById("email").value=p.data.email||data.user.email||"";document.getElementById("phone").value=p.data.phone||"";avatarUrl=p.data.avatar_url||"";document.getElementById("top-name").textContent=p.data.full_name||p.data.email||data.user.email||"Property Manager";renderAvatar();await window.initHomeLinkNotifications()}
document.getElementById("avatar-input").addEventListener("change",async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){alert("The image must be 5MB or smaller.");return}const path=userId+"/profile-"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await window.supabaseClient.storage.from("profile-avatars").upload(path,file,{upsert:true,contentType:file.type});if(up.error){alert(up.error.message);return}const pub=window.supabaseClient.storage.from("profile-avatars").getPublicUrl(path);avatarUrl=pub.data.publicUrl;renderAvatar()});
document.getElementById("saveBtn").onclick=async()=>{const button=document.getElementById("saveBtn");button.disabled=true;button.textContent="Saving...";const r=await window.supabaseClient.from("profiles").update({full_name:document.getElementById("full-name").value.trim(),phone:document.getElementById("phone").value.trim(),avatar_url:avatarUrl||null}).eq("id",userId);button.disabled=false;button.textContent="Save changes";if(r.error){alert(r.error.message);return}document.getElementById("top-name").textContent=document.getElementById("full-name").value.trim()||"Property Manager";renderAvatar();alert("Profile saved.")};
document.getElementById("logoutBtn").onclick=async e=>{e.preventDefault();await window.supabaseClient.auth.signOut();location.href="../index.html"};init();
</script>
</body>
</html>
