<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" type="image/svg+xml" href="../static/favicon.svg">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HomeLink - Contacts</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="../static/css/styles.css"></head>
<body data-role="tenant"><div class="app"><aside class="sidebar"><div><div class="brand"><div class="brand-icon"><i class="fa-solid fa-house"></i></div><span class="brand-name">HomeLink</span></div><nav class="nav" id="mainNav"></nav></div><div class="logout-wrap"><a href="../index.html" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a></div></aside>
<main class="main"><div class="topbar"><div class="bell"><i class="fa-regular fa-bell"></i></div><a class="user profile-link" href="profile.html"><div class="avatar" id="top-avatar"></div><div class="user-info"><p class="user-name" id="top-name">Loading...</p><p class="user-role" id="top-role">Contacts</p></div><i class="fa-solid fa-chevron-down"></i></a></div><section class="content"><div class="page-head"><div><h1 class="page-title">People & Contacts</h1><p class="page-sub">Find contact details for tenants, managers, and contractors.</p></div></div><div class="tabs" id="contactTabs"><button class="tab active" data-kind="all">Everyone</button><button class="tab" data-kind="manager">Managers</button><button class="tab" data-kind="contractor">Contractors</button></div><div id="contactList" class="card-list"><div class="loading-card">Loading contacts...</div></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../static/supabase.js"></script><script src="../static/js/notifications.js"></script><script>
let people=[];let currentId=null;
const esc=v=>String(v??"").replace(/[&<>\'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\'":"&#39;",'"':"&quot;"}[c]));
const capRole=r=>({tenant:"Tenant",manager:"Manager",contractor:"Contractor"}[(r||"").toLowerCase()]||"User");
async function init(){const {data,error}=await window.supabaseClient.auth.getUser();if(error||!data.user){location.href="../index.html";return}currentId=data.user.id;const p=await window.supabaseClient.from("profiles").select("id,full_name,email,role,phone,avatar_url").eq("id",currentId).single();if(p.error){location.href="../index.html";return}const role=String(p.data.role||"").toLowerCase();document.body.dataset.role=role;const profile=role==="manager"?"profile.html":role==="contractor"?"contractor_profile.html":"profile.html";document.querySelector(".profile-link").href=profile;document.getElementById("top-name").textContent=p.data.full_name||p.data.email||data.user.email;document.getElementById("top-role").textContent=capRole(role);document.getElementById("top-avatar").innerHTML=p.data.avatar_url?`<img src="${esc(p.data.avatar_url)}" alt="">`:esc((p.data.full_name||p.data.email||"U").split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase());
const nav={manager:[['manager_dashboard.html','Dashboard'],['manager_properties.html','Properties'],['manager_requests.html','Maintenance Requests'],['tenant_contacts.html','Contacts'],['profile.html','Profile']],contractor:[['contractor_properties.html','Properties'],['contractor_view.html','Assigned Jobs'],['tenant_contacts.html','Contacts'],['contractor_profile.html','Profile']],tenant:[['tenant_dashboard.html','Dashboard'],['my_properties.html','My Properties'],['my_requests.html','My Requests'],['tenant_contacts.html','Contacts'],['profile.html','Profile']]}[role]||[];document.getElementById("mainNav").innerHTML=nav.map(([href,label])=>{const icons={"Dashboard":"fa-table-cells-large","Properties":"fa-building","Maintenance Requests":"fa-screwdriver-wrench","Contacts":"fa-address-book","Profile":"fa-user","Assigned Jobs":"fa-screwdriver-wrench","Contractors":"fa-people-group"};return `<a class="${href==="tenant_contacts.html"?"active":""}" href="${href}"><i class="fa-solid ${icons[label]||"fa-circle"}"></i> ${esc(label)}</a>`}).join("");
const r=await window.supabaseClient.from("profiles").select("id,full_name,email,role,phone").order("full_name");if(r.error){document.getElementById("contactList").textContent="Unable to load contacts: "+r.error.message;return}people=(r.data||[]).filter(x=>x.id!==currentId&&["manager","contractor"].includes(String(x.role||"").toLowerCase()));render("all");if(window.initHomeLinkNotifications)await window.initHomeLinkNotifications()}
function render(kind){const rows=people.filter(p=>kind==="all"||String(p.role||"").toLowerCase()===kind);const list=document.getElementById("contactList");if(!rows.length){list.innerHTML='<div class="empty-card"><h2>No contacts found</h2></div>';return}list.innerHTML=rows.map(p=>{const role=String(p.role||"").toLowerCase();const icon=role==="manager"?"user-tie":role==="contractor"?"screwdriver-wrench":"user";return `<article class="contact-card"><div class="contact-avatar"><i class="fa-solid fa-${icon}"></i></div><div class="contact-body"><h3>${esc(p.full_name||p.email||capRole(role))}</h3><span class="badge badge-assigned">${capRole(role)}</span><p><i class="fa-regular fa-envelope"></i> ${p.email?`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:"Email not provided"}</p><p><i class="fa-solid fa-phone"></i> ${p.phone?`<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>`:"Contact number not provided"}</p></div></article>`}).join("")}
document.querySelectorAll("#contactTabs .tab").forEach(b=>b.onclick=()=>{document.querySelectorAll("#contactTabs .tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.kind)});document.getElementById("logoutBtn").onclick=async e=>{e.preventDefault();await window.supabaseClient.auth.signOut();location.href="../index.html"};init();
</script><script src="../static/js/popups.js"></script>
</body></html>
