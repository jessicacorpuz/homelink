<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HomeLink - My Assigned Jobs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-house"></i></div>
        <span class="brand-name">HomeLink</span>
      </div>
      <nav class="nav">
        <a href="contractor_view.html" class="active"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
        <a href="contractor_view.html"><i class="fa-solid fa-screwdriver-wrench"></i> Assigned Jobs</a>
        <a href="#"><i class="fa-solid fa-comment"></i> Messages</a>
        <a href="#"><i class="fa-solid fa-user"></i> Profile</a>
      </nav>
    </div>
    <div class="logout-wrap">
      <a href="../index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="bell"><i class="fa-regular fa-bell"></i><span class="dot"></span></div>
      <div class="user">
        <div class="avatar"></div>
        <div class="user-info">
          <p class="user-name"></p>
          <p class="user-role">Contractor</p>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>

    <div class="content">
      <h1 class="page-title">My Assigned Jobs</h1>
      <p class="page-sub">View and manage your assigned maintenance requests.</p>

      <div class="tabs">
        <button class="tab active" onclick="filterStatus(this, 'Active')">Active (0)</button>
        <button class="tab" onclick="filterStatus(this, 'Completed')">Completed (0)</button>
      </div>

      <div class="job-grid">
        <p class="empty-state">No jobs assigned yet.</p>
      </div>
    </div>
  </div>
</div>

<script src="../static/js/app.js"></script>
</body>
</html>
