<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HomeLink - Manager Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-house"></i></div>
        <span class="brand-name">HomeLink</span>
      </div>
      <nav class="nav">
        <a href="manager_dashboard.html" class="active"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
        <a href="#"><i class="fa-solid fa-building"></i> Properties</a>
        <a href="#"><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Requests</a>
        <a href="#"><i class="fa-solid fa-users"></i> Contractors</a>
        <a href="#"><i class="fa-solid fa-chart-bar"></i> Reports</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
      </nav>
    </div>
    <div class="logout-wrap">
      <a href="../index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="bell"><i class="fa-regular fa-bell"></i><span class="dot"></span></div>
      <div class="user">
        <div class="avatar"></div>
        <div class="user-info">
          <p class="user-name"></p>
          <p class="user-role">Property Manager</p>
        </div>
        <i class="fa-solid fa-chevron-down"></i>
      </div>
    </div>

    <div class="content">
      <h1 class="page-title">Good afternoon!</h1>
      <p class="page-sub">Here's an overview of your properties and requests.</p>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-icon bg-blue"><i class="fa-solid fa-building"></i></div>
          <div><p class="stat-value">0</p><p class="stat-label">Properties</p></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon bg-rose"><i class="fa-solid fa-screwdriver-wrench"></i></div>
          <div><p class="stat-value">0</p><p class="stat-label">Open Requests</p></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon bg-amber"><i class="fa-solid fa-clock"></i></div>
          <div><p class="stat-value">0</p><p class="stat-label">In Progress</p></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon bg-emerald"><i class="fa-solid fa-check"></i></div>
          <div><p class="stat-value">0</p><p class="stat-label">Completed</p></div>
        </div>
      </div>

      <div class="section-header">
        <h2>Recent Requests</h2>
        <button class="link-btn">View All</button>
      </div>
      <div class="request-list">
        <p class="empty-state">No maintenance requests yet.</p>
      </div>
    </div>
  </div>
</div>

<script src="../static/js/app.js"></script>
</body>
</html>
