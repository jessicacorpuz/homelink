<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HomeLink - Sign Up</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="static/css/styles.css">
</head>
<body>

<div class="login-page">
  <div class="login-hero">
    <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=1200&q=80" alt="Apartment building">
    <div class="login-hero-overlay"></div>

    <div class="login-hero-brand">
      <div class="brand-icon"><i class="fa-solid fa-house"></i></div>
      <div>
        <p>HomeLink</p>
        <p>Property Management Made Simple</p>
      </div>
    </div>

    <div class="login-hero-text">
      <h1>Join HomeLink.<br>Manage Things Easier.</h1>
      <p>A faster, easier way for tenants, property managers, and contractors to work together.</p>
    </div>
  </div>

  <div class="login-form-side">
    <div class="login-form">
      <h2>Create Account</h2>
      <p class="page-sub">Sign up for your HomeLink account</p>

      <div class="role-tabs">
        <div class="role-tab active" onclick="selectRole(this, 'tenant')">Tenant</div>
        <div class="role-tab" onclick="selectRole(this, 'manager')">Manager</div>
        <div class="role-tab" onclick="selectRole(this, 'contractor')">Contractor</div>
      </div>

      <form id="signup-form" onsubmit="event.preventDefault(); signUp();">
        <input type="hidden" id="selected-role" value="tenant">

        <div class="form-group">
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" placeholder="Your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Create a password" required minlength="6">
            <button type="button" onclick="togglePassword(this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="confirm-password" placeholder="Confirm your password" required minlength="6">
            <button type="button" onclick="togglePassword(this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-block" id="sign-up-button">
          Create account
        </button>
      </form>

      <div class="divider">or continue with</div>

      <button type="button" class="btn-social" onclick="signUpWithGoogle()">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>

      <p class="signup-line">
        Already have an account?
        <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>
</div>

<script src="static/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="static/supabase.js"></script>

<script>
function selectRole(element, role) {
    document.querySelectorAll(".role-tab").forEach(tab => {
        tab.classList.remove("active");
    });

    element.classList.add("active");
    document.getElementById("selected-role").value = role;
}

async function signUp() {
    const fullName = document.getElementById("full-name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm-password").value;
    const role = document.getElementById("selected-role").value;
    const button = document.getElementById("sign-up-button");

    if (!fullName || !email || !password || !confirmPassword) {
        alert("Please fill in all fields.");
        return;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {
        const { data, error } =
            await window.supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        full_name: fullName,
                        role: role
                    }
                }
            });

        if (error) {
            alert(error.message);
            return;
        }

        if (!data.user) {
            alert("Account could not be created.");
            return;
        }

        if (data.session) {
            alert("Account created successfully!");
            redirectByRole(role);
        } else {
            alert(
                "Account created! Please check your email to confirm your account, then sign in."
            );
            window.location.href = "index.html";
        }

    } catch (error) {
        console.error(error);
        alert("Something went wrong while creating your account.");
    } finally {
        button.disabled = false;
        button.textContent = "Create account";
    }
}

async function signUpWithGoogle() {
    const role = document.getElementById("selected-role").value;

    localStorage.setItem("pendingHomeLinkRole", role);

    const { error } =
        await window.supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
                redirectTo: window.location.origin + "/google-callback.html"
            }
        });

    if (error) {
        console.error(error);
        alert(error.message);
    }
}

function redirectByRole(role) {
    if (role === "tenant") {
        window.location.href = "pages/tenant_dashboard.html";
    } else if (role === "manager") {
        window.location.href = "pages/manager_dashboard.html";
    } else if (role === "contractor") {
        window.location.href = "pages/contractor_view.html";
    } else {
        window.location.href = "index.html";
    }
}
</script>

</body>
</html>
