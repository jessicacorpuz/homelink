<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HomeLink - Signing In</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<p style="font-family: sans-serif; text-align: center; margin-top: 20vh;">
  Signing you in...
</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="static/supabase.js"></script>

<script>
async function finishGoogleLogin() {
    const { data, error } =
        await window.supabaseClient.auth.getSession();

    if (error || !data.session) {
        console.error(error);
        alert("Google sign-in could not be completed.");
        window.location.href = "index.html";
        return;
    }

    const user = data.session.user;

    const { data: profile, error: profileError } =
        await window.supabaseClient
            .from("profiles")
            .select("id, full_name, email, role")
            .eq("id", user.id)
            .maybeSingle();

    if (profileError) {
        console.error(profileError);
        alert("Your HomeLink profile could not be loaded.");
        window.location.href = "index.html";
        return;
    }

    if (!profile) {
        await window.supabaseClient.auth.signOut();
        localStorage.removeItem("pendingHomeLinkRole");

        alert(
            "Your Google account is connected, but no HomeLink profile was found. " +
            "Please sign up again and select your role."
        );

        window.location.href = "signup.html";
        return;
    }

    localStorage.removeItem("pendingHomeLinkRole");

    if (profile.role === "tenant") {
        window.location.href = "pages/tenant_dashboard.html";
    } else if (profile.role === "manager") {
        window.location.href = "pages/manager_dashboard.html";
    } else if (profile.role === "contractor") {
        window.location.href = "pages/contractor_view.html";
    } else {
        await window.supabaseClient.auth.signOut();
        alert("Your account has an invalid role.");
        window.location.href = "index.html";
    }
}

finishGoogleLogin();
</script>
</body>
</html>
